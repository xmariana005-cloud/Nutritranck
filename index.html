<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriTrack</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
=====================================================================
CONFIGURAÇÃO (preencha DEPOIS de criar o projeto no Supabase)
Enquanto estiver vazio, o site funciona em MODO LOCAL (contas e dados
ficam só no navegador do aparelho — serve só para testar).

SQL para rodar no Supabase (SQL Editor):

create table nutritrack (
  user_id uuid primary key references auth.users(id) on delete cascade,
  dados jsonb not null default '{}'::jsonb,
  atualizado timestamptz default now()
);
alter table nutritrack enable row level security;
create policy "dono le" on nutritrack for select using (auth.uid() = user_id);
create policy "dono insere" on nutritrack for insert with check (auth.uid() = user_id);
create policy "dono atualiza" on nutritrack for update using (auth.uid() = user_id);
=====================================================================
-->
<script>
  const SUPABASE_URL = "";      // ex: https://xxxx.supabase.co
  const SUPABASE_ANON_KEY = ""; // chave "anon/publishable"

  // Medições iniciais: aparecem como botão "Carregar medições iniciais" na tela de Bioimpedância
  // (só quem clicar recebe; cada conta decide). Apague este bloco se o repositório for público.
  const MEDICOES_INICIAIS = [
    {data: "2026-08-07", peso: 98.05, gordura: 42.8, musculo: 31.4, pct: 43.6, visc: 12},
    {data: "2026-10-24", peso: 80.20, gordura: 29.4, musculo: 28.3, pct: 36.6, visc: 7}
  ];
  // Plano alimentar inicial (carboidratos são estimativas — ajuste se precisar)
  const PLANO_INICIAL = [
    {nome: "Café da Manhã", hora: "08:00", prot: 14, carb: 12,
     desc: "2 ovos inteiros (cozidos ou mexidos) + 2 torradas Leviss (11 kcal cada) + 1 xícara de café sem açúcar",
     trocas: "Trocar a proteína: 2 ovos (122g) OU 100g de peito de frango desfiado OU 110g de atum em conserva"},
    {nome: "Almoço", hora: "14:00", prot: 42, carb: 50,
     desc: "Proteína (130g a 150g): 130–150g de filé de frango OU 130–140g de patinho moído/grelhado OU 150g de filé de peixe. Feijão: 2 conchas pequenas (100g) ou lentilha (81g). Salada: folhas verdes à vontade + 4 colheres de legumes (tomate, pepino, brócolis)",
     trocas: "Carboidrato: 3 colheres de sopa de arroz (135g) OU 3 fatias de batata doce (210g) OU 4,5 batatas inglesas pequenas (315g) OU 1 pegador de macarrão (110g)"},
    {nome: "Lanche da Tarde", hora: "16:00", prot: 32, carb: 33,
     desc: "1 iogurte natural desnatado (200g) + 1 dosador de whey protein (30g) + 3 colheres de farelo de aveia ou chia (30g) + 1 fruta",
     trocas: "Fruta (1 opção): 2 bananas (200g) OU 15 morangos (105g) OU 15 uvas (120g) OU 2 maçãs (260g) OU 1 fatia de mamão (170g)"},
    {nome: "Jantar (opcional)", hora: "19:00", prot: 14, carb: 2,
     desc: "Com fome normal: 130–150g de frango/carne/peixe + abóbora cabotiá (300g) ou batata doce (175g) ou arroz (113g) + feijão (100g) + salada à vontade",
     trocas: "Pouca fome: omelete rápida de 2 ovos OU 1 potinho de iogurte proteico OU 100g de frango com salada. Sem fome: não precisa comer"}
  ];
</script>
<style>
:root{--p1:#3C096C;--p2:#5A189A;--p3:#7B2CBF;--p4:#C77DFF;--soft:#F3E8FF;--mut:#6C657B;--shadow:0 10px 30px rgba(60,9,108,.08)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
body{background:linear-gradient(160deg,#F3EAFF 0%,#FAF8FF 45%,#FFFFFF 100%) fixed;color:#1D1A27;min-height:100vh}
button{cursor:pointer;border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.92rem;background:linear-gradient(135deg,#7B2CBF,#9D4EDD);color:#fff;box-shadow:0 6px 16px rgba(123,44,191,.28);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(123,44,191,.35)}
button:active{transform:translateY(0)}
button.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}
button.mini{padding:6px 14px;font-size:.85rem}
button.del{background:transparent;color:#c0392b;padding:6px 10px;box-shadow:none;font-size:1rem}
button.del:hover{background:#fdecea;box-shadow:none}
input,select{width:100%;padding:12px 16px;border:1.5px solid #E7DCF7;border-radius:16px;font-size:.95rem;background:#FBF8FF;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus{border-color:#9D4EDD;box-shadow:0 0 0 4px rgba(157,78,221,.15);background:#fff}
label{font-size:.78rem;color:var(--mut);font-weight:600;display:block;margin:0 0 6px 6px}
.hidden{display:none!important}

/* LOGIN */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 15%,#9D4EDD 0,transparent 45%),linear-gradient(135deg,#240046,#5A189A);padding:20px}
.auth-box{background:rgba(255,255,255,.97);border-radius:32px;padding:36px 32px;width:100%;max-width:410px;box-shadow:0 30px 60px rgba(0,0,0,.28)}
.auth-box h1{color:var(--p1);font-size:1.7rem;margin-bottom:4px}
.auth-box p.sub{color:var(--mut);font-size:.92rem;margin-bottom:22px}
.tabs{display:flex;gap:6px;margin-bottom:20px;background:#F1E8FB;padding:5px;border-radius:999px}
.tabs button{flex:1;background:transparent;color:var(--mut);box-shadow:none}
.tabs button.on{background:#fff;color:var(--p2);box-shadow:0 4px 10px rgba(60,9,108,.12)}
.field{margin-bottom:14px}
#msg{font-size:.85rem;margin-top:12px;min-height:18px;color:#c0392b;text-align:center}
#modo{font-size:.75rem;color:var(--mut);margin-top:14px;text-align:center}

/* APP */
#app{display:flex;min-height:100vh}
.sidebar{width:260px;background:linear-gradient(170deg,#3C096C 0%,#5A189A 100%);color:#fff;padding:30px 18px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:16px;margin:16px;height:calc(100vh - 32px);border-radius:32px;box-shadow:0 20px 40px rgba(60,9,108,.3)}
.brand h1{font-size:1.35rem;font-weight:800;letter-spacing:1.5px}
.brand p{font-size:.85rem;color:#E0AAFF;margin-top:4px;margin-bottom:28px}
.menu{list-style:none;display:flex;flex-direction:column;gap:8px;flex:1}
.menu-item{padding:14px 18px;border-radius:18px;color:#E0AAFF;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.menu-item:hover{background:rgba(255,255,255,.1);color:#fff}
.menu-item.active{background:#fff;color:var(--p2);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.main-content{flex:1;padding:32px 36px 40px 16px;overflow-x:hidden;min-width:0}
.main-content>*{animation:up .4s ease both}
.main-content>*:nth-child(2){animation-delay:.05s}.main-content>*:nth-child(3){animation-delay:.1s}.main-content>*:nth-child(4){animation-delay:.15s}.main-content>*:nth-child(5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.header{margin-bottom:26px}
.header h2{font-size:1.9rem;color:var(--p1);font-weight:800}
.header p{color:var(--mut);font-size:.95rem;margin-top:6px}
.card{background:#fff;border-radius:28px;padding:26px;box-shadow:var(--shadow);margin-bottom:22px;border:1px solid rgba(157,78,221,.08)}
.card-title{font-size:1.08rem;color:var(--p1);font-weight:800;margin-bottom:20px}
.rings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;text-align:center}
.ring-card{display:flex;flex-direction:column;align-items:center;background:#FBF8FF;border-radius:24px;padding:18px 10px}
.ring-container{width:104px;height:104px}
.ring-label{font-weight:800;color:var(--p1);margin-top:12px;font-size:.95rem}
.ring-sub{font-size:.8rem;color:var(--mut);margin-bottom:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end}
.meal-list{display:flex;flex-direction:column;gap:12px}
.meal-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;background:#FBF8FF;border-radius:22px;border:1.5px solid #EFE4FB;transition:all .2s}
.meal-item.completed{background:var(--soft);border-color:#DDBFFA}
.meal-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.meal-checkbox{width:24px;height:24px;accent-color:#7B2CBF;cursor:pointer;flex-shrink:0}
.meal-info h4{font-size:.98rem;color:var(--p1)}
.meal-info p{font-size:.85rem;color:var(--mut);margin-top:2px}
.meal-badge{background:linear-gradient(135deg,#7B2CBF,#9D4EDD);color:#fff;padding:5px 14px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.empty{color:var(--mut);font-size:.9rem}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid rgba(157,78,221,.08)}
.kpi span{font-size:.78rem;color:var(--mut);font-weight:600}
.kpi b{display:block;font-size:1.65rem;color:var(--p1);margin:4px 0}
.kpi i{font-style:normal;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#E6FAF7;color:#0F8F82}
.kpi i.up{background:#FFF1DD;color:#B26A00}
.topbar,.overlay{display:none}
@media(max-width:800px){
  #app{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#3C096C,#5A189A);color:#fff;padding:12px 16px;border-radius:0 0 24px 24px;box-shadow:0 8px 20px rgba(60,9,108,.25)}
  .topbar button{background:rgba(255,255,255,.18);box-shadow:none;padding:8px 16px}
  .topbar b{letter-spacing:1.5px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;margin:0;height:auto;width:280px;z-index:50;transform:translateX(-105%);transition:transform .28s ease;overflow-y:auto;border-radius:0 32px 32px 0}
  .sidebar.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(36,0,70,.5);backdrop-filter:blur(3px);z-index:40}
  .main-content{padding:22px 16px 40px}
  .meal-item{flex-wrap:wrap}
  .header h2{font-size:1.6rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="auth">
  <div class="auth-box">
    <h1>🥗 NutriTrack</h1>
    <p class="sub">Entre ou crie sua conta para acompanhar sua alimentação.</p>
    <div class="tabs">
      <button id="tabIn" class="on" onclick="setModo('in')">Entrar</button>
      <button id="tabUp" onclick="setModo('up')">Criar conta</button>
    </div>
    <div class="field hidden" id="fNome"><label>Nome</label><input id="nome" placeholder="Seu nome"></div>
    <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha (mín. 6 caracteres)</label><input id="senha" type="password" onkeydown="if(event.key==='Enter')enviar()"></div>
    <button style="width:100%" id="btnEnviar" onclick="enviar()">Entrar</button>
    <div id="msg"></div>
    <div id="modo"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar"><button onclick="toggleMenu()">☰ Menu</button><b>NUTRITRACK</b></div>
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <aside class="sidebar">
    <div class="brand"><h1>NUTRITRACK</h1><p id="quem"></p></div>
    <ul class="menu">
      <li class="menu-item active" data-k="home" onclick="ir('home')"><span>🏠</span> Página Inicial</li>
      <li class="menu-item" data-k="plan" onclick="ir('plan')"><span>📋</span> Plano Alimentar do Dia</li>
      <li class="menu-item" data-k="bio" onclick="ir('bio')"><span>📊</span> Relatório Bioimpedância</li>
    </ul>
    <button class="ghost" onclick="sair()">Sair</button>
  </aside>
  <main class="main-content" id="main"></main>
</div>

<script>
/* ===================== DADOS / CONTAS ===================== */
const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = CLOUD ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let user = null;
const novoEstado = () => ({
  metas: {prot: 120, carb: 130, veg: 3, agua: 3.0},
  refeicoes: [], dia: "", agua: 0, veg: 0,
  hist: {},   // { "2026-10-24": gramas de proteína }
  bio: []     // [{data, gordura, musculo}]
});
let state = novoEstado();

const hoje = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtData = d => d.split("-").reverse().join("/");
const sha = async t => {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("nutritrack::" + t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
};
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

async function cadastrar(nome, email, senha) {
  if (CLOUD) {
    const {data, error} = await sb.auth.signUp({email, password: senha, options: {data: {nome}}});
    if (error) throw error;
    if (!data.session) throw new Error("Conta criada! Confirme o e-mail enviado e depois entre.");
    return {id: data.user.id, nome, email};
  }
  const users = lsGet("nt_users", {});
  if (users[email]) throw new Error("Este e-mail já tem conta.");
  users[email] = {id: "u_" + Date.now(), nome, email, hash: await sha(senha)};
  lsSet("nt_users", users);
  return {id: users[email].id, nome, email};
}
async function entrar(email, senha) {
  if (CLOUD) {
    const {data, error} = await sb.auth.signInWithPassword({email, password: senha});
    if (error) throw new Error("E-mail ou senha incorretos.");
    return {id: data.user.id, nome: data.user.user_metadata?.nome || email, email};
  }
  const u = lsGet("nt_users", {})[email];
  if (!u || u.hash !== await sha(senha)) throw new Error("E-mail ou senha incorretos.");
  return {id: u.id, nome: u.nome, email};
}
async function carregar() {
  let d;
  if (CLOUD) {
    const r = await sb.from("nutritrack").select("dados").eq("user_id", user.id).maybeSingle();
    d = r.data?.dados;
  } else d = lsGet("nt_dados_" + user.id, null);
  state = Object.assign(novoEstado(), d || {});
  // Conta nova (vazia): já entra com o plano alimentar e as medições iniciais
  if (!state.semeado && !state.refeicoes.length && !state.bio.length) {
    state.refeicoes = PLANO_INICIAL.map((r, i) => ({id: "p" + Date.now() + i, feito: false, ...r}));
    MEDICOES_INICIAIS.forEach((m, i) => state.bio.push({id: "seed" + i, ...m}));
  }
  state.semeado = true;
  virarODia();
}
Chart.defaults.font.family = "'Inter','Segoe UI',system-ui,sans-serif";
Chart.defaults.color = "#6C657B";
let saveT;
function salvar() {
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    if (CLOUD) await sb.from("nutritrack").upsert({user_id: user.id, dados: state, atualizado: new Date().toISOString()});
    else lsSet("nt_dados_" + user.id, state);
  }, 300);
}
/* Quando muda o dia: guarda a proteína de ontem no histórico e zera o checklist */
function virarODia() {
  const h = hoje();
  if (state.dia && state.dia !== h) {
    state.hist[state.dia] = totais().prot;
    state.refeicoes.forEach(r => r.feito = false);
    state.agua = 0; state.veg = 0;
  }
  state.dia = h; salvar();
}
function totais() {
  const f = state.refeicoes.filter(r => r.feito);
  return {prot: f.reduce((a,r) => a + r.prot, 0), carb: f.reduce((a,r) => a + r.carb, 0)};
}

/* ===================== LOGIN UI ===================== */
let modo = "in";
document.getElementById("modo").textContent = CLOUD
  ? "Conta segura na nuvem."
  : "⚠️ Modo local de teste: contas e dados ficam só neste aparelho.";
function setModo(m) {
  modo = m;
  tabIn.classList.toggle("on", m === "in"); tabUp.classList.toggle("on", m === "up");
  fNome.classList.toggle("hidden", m === "in");
  btnEnviar.textContent = m === "in" ? "Entrar" : "Criar conta";
  msg.textContent = "";
}
async function enviar() {
  msg.textContent = "";
  const n = nome.value.trim(), e = email.value.trim().toLowerCase(), s = senha.value;
  try {
    if (!e || s.length < 6) throw new Error("Informe e-mail e senha de ao menos 6 caracteres.");
    if (modo === "up") { if (!n) throw new Error("Informe seu nome."); user = await cadastrar(n, e, s); }
    else user = await entrar(e, s);
    await iniciar();
  } catch (err) { msg.textContent = err.message; }
}
async function sair() {
  if (CLOUD) await sb.auth.signOut();
  localStorage.removeItem("nt_sessao"); location.reload();
}
async function iniciar() {
  if (!CLOUD) lsSet("nt_sessao", user);
  await carregar();
  auth.classList.add("hidden"); app.classList.remove("hidden");
  quem.textContent = user.nome;
  ir("home");
}
(async () => {
  if (CLOUD) {
    const {data} = await sb.auth.getSession();
    if (data.session) { const u = data.session.user; user = {id: u.id, nome: u.user_metadata?.nome || u.email, email: u.email}; iniciar(); }
  } else { const s = lsGet("nt_sessao", null); if (s) { user = s; iniciar(); } }
})();

/* ===================== TELAS ===================== */
let aba = "home", charts = [];
function toggleMenu() {
  document.querySelector(".sidebar").classList.toggle("open");
  overlay.classList.toggle("show");
}
function ir(k) {
  document.querySelector(".sidebar").classList.remove("open"); overlay.classList.remove("show");
  window.scrollTo(0, 0);
  aba = k; virarODia();
  document.querySelectorAll(".menu-item").forEach(i => i.classList.toggle("active", i.dataset.k === k));
  charts.forEach(c => c.destroy()); charts = [];
  ({home: telaHome, plan: telaPlano, bio: telaBio})[k]();
}
function anel(id, valor, meta, cor) {
  const pct = meta > 0 ? Math.min(100, Math.round(valor / meta * 100)) : 0;
  charts.push(new Chart(document.getElementById(id), {
    type: "doughnut",
    data: {datasets: [{data: [pct, 100 - pct], backgroundColor: [cor, "#ECE4F7"], borderWidth: 0, borderRadius: 20}]},
    options: {cutout: "78%", responsive: true, maintainAspectRatio: false, plugins: {tooltip: {enabled: false}, legend: {display: false}}}
  }));
}

/* --- PÁGINA INICIAL --- */
function telaHome() {
  const t = totais(), m = state.metas;
  const ring = (id, nome, sub, extra="") => `<div class="ring-card"><div class="ring-container"><canvas id="${id}"></canvas></div><div class="ring-label">${nome}</div><div class="ring-sub">${sub}</div>${extra}</div>`;
  main.innerHTML = `
    <div class="header"><h2>Olá, ${esc(user.nome.split(" ")[0])}!</h2><p>Visão geral do consumo nutricional do dia e histórico mensal</p></div>
    ${state.refeicoes.length === 0 && state.bio.length === 0 ? '<div class="card"><h3 class="card-title">Começar</h3><p class="empty" style="margin-bottom:12px">Conta nova? Carregue o plano alimentar e as medições de bioimpedância iniciais.</p><button onclick="carregarTudo()">Carregar plano e medições</button></div>' : ""}
    <div class="card">
      <h3 class="card-title">Consumo de Hoje (Visão Geral de Nutrientes)</h3>
      <div class="rings-grid">
        ${ring("rP","Proteína",`${t.prot}g / ${m.prot}g`)}
        ${ring("rC","Carboidrato",`${t.carb}g / ${m.carb}g`)}
        ${ring("rV","Vegetais",`${state.veg} / ${m.veg} porções`,`<div><button class="mini" onclick="ajusta('veg',-1)">−</button> <button class="mini" onclick="ajusta('veg',1)">+</button></div>`)}
        ${ring("rA","Água",`${state.agua.toFixed(1)}L / ${m.agua.toFixed(1)}L`,`<div><button class="mini" onclick="ajusta('agua',-0.25)">−</button> <button class="mini" onclick="ajusta('agua',0.25)">+ 250ml</button></div>`)}
      </div>
    </div>
    ${state.bio.some(x => x.peso) ? '<div class="card"><h3 class="card-title">Evolução do peso</h3><canvas id="chartPeso" height="90"></canvas></div>' : ""}
    <div class="card">
      <h3 class="card-title">Acompanhamento Mensal de Proteína</h3>
      <canvas id="chartMonthly" height="100"></canvas>
    </div>
    <div class="card">
      <h3 class="card-title">Minhas metas diárias</h3>
      <div class="metas">
        <div><label>Proteína (g)</label><input id="mp" type="number" value="${m.prot}"></div>
        <div><label>Carboidrato (g)</label><input id="mc" type="number" value="${m.carb}"></div>
        <div><label>Vegetais (porções)</label><input id="mv" type="number" value="${m.veg}"></div>
        <div><label>Água (L)</label><input id="ma" type="number" step="0.1" value="${m.agua}"></div>
        <button onclick="salvarMetas()">Salvar metas</button>
      </div>
    </div>`;
  anel("rP", t.prot, m.prot, "#7B2CBF"); anel("rC", t.carb, m.carb, "#FF9F1C");
  anel("rV", state.veg, m.veg, "#2EC4B6"); anel("rA", state.agua, m.agua, "#3A86EF");

  // histórico do mês corrente (inclui hoje)
  const h = hoje(), [ano, mes] = h.split("-"), dias = new Date(+ano, +mes, 0).getDate();
  const hist = {...state.hist, [h]: t.prot};
  const labels = [], vals = [];
  for (let d = 1; d <= dias; d++) {
    const k = `${ano}-${mes}-${String(d).padStart(2,"0")}`;
    labels.push("D" + d); vals.push(hist[k] ?? 0);
  }
  charts.push(new Chart(chartMonthly, {
    type: "bar",
    data: {labels, datasets: [{data: vals, backgroundColor: "#9D4EDD", borderRadius: 10, borderSkipped: false}]},
    options: {responsive: true, plugins: {legend: {display: false}}, scales: {x: {grid: {display: false}}, y: {beginAtZero: true, grid: {color: "#F0E8FA"}, suggestedMax: Math.max(m.prot, ...vals) + 10}}}
  }));
  if (document.getElementById("chartPeso")) {
    const bs = [...state.bio].filter(x => x.peso).sort((a, c) => a.data.localeCompare(c.data));
    charts.push(new Chart(chartPeso, {
      type: "line",
      data: {labels: bs.map(x => fmtData(x.data).slice(0, 5)), datasets: [{label: "Peso (kg)", data: bs.map(x => x.peso), borderColor: "#7B2CBF", backgroundColor: "rgba(157,78,221,.15)", fill: true, tension: .4, pointRadius: 6, pointBackgroundColor: "#fff", pointBorderWidth: 3, borderWidth: 3}]},
      options: {responsive: true, plugins: {legend: {display: false}}, scales: {x: {grid: {display: false}}, y: {grid: {color: "#F0E8FA"}}}}
    }));
  }
}
function ajusta(campo, delta) {
  state[campo] = Math.max(0, +(state[campo] + delta).toFixed(2)); salvar(); ir("home");
}
function salvarMetas() {
  state.metas = {prot: +mp.value || 0, carb: +mc.value || 0, veg: +mv.value || 0, agua: +ma.value || 0};
  salvar(); ir("home");
}

/* --- PLANO ALIMENTAR --- */
function telaPlano() {
  const lista = [...state.refeicoes].sort((a,b) => a.hora.localeCompare(b.hora));
  const t = totais();
  main.innerHTML = `
    <div class="header"><h2>Plano Alimentar do Dia</h2><p>Marque as refeições concluídas e acompanhe o aporte de proteína — hoje: <b>${t.prot}g</b> de proteína e <b>${t.carb}g</b> de carboidrato</p></div>
    <div class="card">
      <h3 class="card-title">Checklist Diário de Refeições</h3>
      <div class="meal-list">
        ${lista.length ? lista.map(r => `
          <div class="meal-item ${r.feito ? "completed" : ""}">
            <div class="meal-left">
              <input type="checkbox" class="meal-checkbox" ${r.feito ? "checked" : ""} onchange="marcar('${r.id}')">
              <div class="meal-info"><h4>${esc(r.nome)} (${esc(r.hora)})</h4><p>${esc(r.desc)}</p>${r.trocas ? `<p style="margin-top:4px;color:#5A189A"><i>${esc(r.trocas)}</i></p>` : ""}</div>
            </div>
            <span class="meal-badge">${r.prot}g Prot</span>
            <span class="meal-badge" style="background:#FF9F1C">${r.carb}g Carb</span>
            <button class="del" onclick="apagar('${r.id}')">✕</button>
          </div>`).join("") : '<p class="empty">Nenhuma refeição cadastrada. Adicione abaixo.</p>'}
      </div>
    </div>
    <div class="card">
      <h3 class="card-title">Adicionar refeição ao plano</h3>
      <div class="form">
        <div><label>Nome</label><input id="rn" placeholder="Ex.: Café da Manhã"></div>
        <div><label>Horário</label><input id="rh" type="time" value="08:00"></div>
        <div style="grid-column:span 2"><label>O que vai comer</label><input id="rd" placeholder="Ex.: 2 ovos mexidos + 2 torradas"></div>
        <div style="grid-column:span 2"><label>Opções de troca (opcional)</label><input id="rt" placeholder="Ex.: ou 100g de frango desfiado"></div>
        <div><label>Proteína (g)</label><input id="rp" type="number" min="0"></div>
        <div><label>Carboidrato (g)</label><input id="rc" type="number" min="0"></div>
        <button onclick="addRefeicao()">Adicionar</button>
        <button style="background:#5A189A" onclick="carregarPlano()">Carregar plano alimentar inicial</button>
      </div>
    </div>`;
}
function addRefeicao() {
  if (!rn.value.trim()) return alert("Informe o nome da refeição.");
  state.refeicoes.push({id: "r" + Date.now(), nome: rn.value.trim(), hora: rh.value || "00:00", desc: rd.value.trim(), trocas: rt.value.trim(), prot: +rp.value || 0, carb: +rc.value || 0, feito: false});
  salvar(); ir("plan");
}
function marcar(id) { const r = state.refeicoes.find(x => x.id === id); r.feito = !r.feito; salvar(); ir("plan"); }
function apagar(id) { if (!confirm("Remover esta refeição do plano?")) return; state.refeicoes = state.refeicoes.filter(x => x.id !== id); salvar(); ir("plan"); }

/* --- BIOIMPEDÂNCIA --- */
function telaBio() {
  const b = [...state.bio].sort((a,c) => a.data.localeCompare(c.data));
  main.innerHTML = `
    <div class="header"><h2>Relatório de Bioimpedância</h2><p>Acompanhamento da redução de gordura e massa muscular</p></div>
    ${kpisBio(b)}
    <div class="card">
      <h3 class="card-title">Evolução Corporal (Peso, Gordura e Massa Muscular)</h3>
      ${b.length ? '<canvas id="chartBio" height="110"></canvas>' : '<p class="empty">Adicione sua primeira medição abaixo para ver o gráfico.</p>'}
      ${state.bio.length === 0 && MEDICOES_INICIAIS.length ? '<button style="margin-top:12px" onclick="carregarIniciais()">Carregar medições iniciais (07/08 e 24/10)</button>' : ""}
    </div>
    <div class="card">
      <h3 class="card-title">Nova medição</h3>
      <div class="form">
        <div><label>Data</label><input id="bd" type="date" value="${hoje()}"></div>
        <div><label>Peso (kg)</label><input id="bp" type="number" step="0.01"></div>
        <div><label>Massa de gordura (kg)</label><input id="bg" type="number" step="0.1"></div>
        <div><label>Massa muscular esquelética (kg)</label><input id="bm" type="number" step="0.1"></div>
        <div><label>Gordura (%) — opcional</label><input id="bpc" type="number" step="0.1"></div>
        <div><label>Gordura visceral — opcional</label><input id="bv" type="number" step="1"></div>
        <button onclick="addBio()">Adicionar</button>
      </div>
    </div>
    ${b.length ? `<div class="card"><h3 class="card-title">Medições</h3><div class="meal-list">${[...b].reverse().map(x => `
      <div class="meal-item"><div class="meal-left"><div class="meal-info"><h4>${fmtData(x.data)}</h4><p>${x.peso ? `Peso ${x.peso} kg · ` : ""}Gordura ${x.gordura} kg${x.pct ? ` (${x.pct}%)` : ""} · Músculo ${x.musculo} kg${x.visc ? ` · Visceral ${x.visc}` : ""}</p></div></div>
      <button class="del" onclick="apagarBio('${x.id}')">✕</button></div>`).join("")}</div></div>` : ""}`;
  if (b.length) charts.push(new Chart(chartBio, {
    type: "line",
    data: {labels: b.map(x => fmtData(x.data).slice(0,5)), datasets: [
      {label: "Peso (kg)", data: b.map(x => x.peso ?? null), borderColor: "#3A86EF", backgroundColor: "#3A86EF", tension: .4, spanGaps: true, borderWidth: 3, pointRadius: 6, pointBackgroundColor: "#fff", pointBorderWidth: 3},
      {label: "Massa de Gordura (kg)", data: b.map(x => x.gordura), borderColor: "#7B2CBF", backgroundColor: "#7B2CBF", tension: .4, borderWidth: 3, pointRadius: 6, pointBackgroundColor: "#fff", pointBorderWidth: 3},
      {label: "Massa Muscular (kg)", data: b.map(x => x.musculo), borderColor: "#2EC4B6", backgroundColor: "#2EC4B6", tension: .4, borderWidth: 3, pointRadius: 6, pointBackgroundColor: "#fff", pointBorderWidth: 3}
    ]},
    options: {responsive: true, interaction: {mode: "index", intersect: false}, plugins: {legend: {position: "bottom", labels: {usePointStyle: true, boxWidth: 8}}}, scales: {x: {grid: {display: false}}, y: {grid: {color: "#F0E8FA"}}}}
  }));
}
/* Resumo da evolução: primeira medição → última medição */
function kpisBio(b) {
  if (b.length < 2) return "";
  const f = b[0], l = b[b.length - 1];
  const card = (nome, k, un, menorMelhor) => {
    if (f[k] == null || l[k] == null) return "";
    const d = +(l[k] - f[k]).toFixed(1), bom = menorMelhor ? d <= 0 : d >= 0;
    return `<div class="kpi"><span>${nome}</span><b>${l[k]} ${un}</b><i class="${bom ? "" : "up"}">${d > 0 ? "+" : ""}${d} ${un}</i></div>`;
  };
  const dias = Math.round((new Date(l.data) - new Date(f.data)) / 86400000);
  return `<div class="header" style="margin-bottom:14px"><p>Evolução de ${fmtData(f.data)} a ${fmtData(l.data)} (${dias} dias)</p></div>
    <div class="kpis">${card("Peso", "peso", "kg", true)}${card("Massa de gordura", "gordura", "kg", true)}${card("Massa muscular", "musculo", "kg", false)}${card("Gordura corporal", "pct", "%", true)}${card("Gordura visceral", "visc", "", true)}</div>`;
}
function addBio() {
  if (!bd.value || !bp.value || !bg.value || !bm.value) return alert("Preencha data, peso, gordura e músculo.");
  state.bio.push({id: "b" + Date.now(), data: bd.value, peso: +bp.value, gordura: +bg.value, musculo: +bm.value,
    pct: bpc.value ? +bpc.value : undefined, visc: bv.value ? +bv.value : undefined});
  salvar(); ir("bio");
}
function carregarPlano() {
  if (state.refeicoes.length && !confirm("Isso substitui as refeições atuais pelo plano inicial. Continuar?")) return;
  state.refeicoes = PLANO_INICIAL.map((r, i) => ({id: "p" + Date.now() + i, feito: false, ...r}));
  salvar(); ir("plan");
}
function carregarTudo() {
  state.refeicoes = PLANO_INICIAL.map((r, i) => ({id: "p" + Date.now() + i, feito: false, ...r}));
  MEDICOES_INICIAIS.forEach((m, i) => { if (!state.bio.some(x => x.data === m.data)) state.bio.push({id: "seed" + i, ...m}); });
  salvar(); ir("home");
}
function carregarIniciais() {
  MEDICOES_INICIAIS.forEach((m, i) => { if (!state.bio.some(x => x.data === m.data)) state.bio.push({id: "seed" + i, ...m}); });
  salvar(); ir("bio");
}
function apagarBio(id) { if (!confirm("Remover esta medição?")) return; state.bio = state.bio.filter(x => x.id !== id); salvar(); ir("bio"); }
</script>
</body>
</html>
