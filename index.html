<!--
=====================================================================
CONFIGURAÇÃO (preencha DEPOIS de criar o projeto no Supabase)
Enquanto estiver vazio, o site funciona em MODO LOCAL (contas e dados
ficam só no navegador do aparelho — serve só para testar).

SQL para rodar no Supabase (SQL Editor):

create table nutritrack (
  user_id uuid primary key references auth.users(id) on delete cascade,
  dados jsonb not null default '{}'::jsonb,
  atualizado timestamptz default now()
);
alter table nutritrack enable row level security;
create policy "dono le" on nutritrack for select using (auth.uid() = user_id);
create policy "dono insere" on nutritrack for insert with check (auth.uid() = user_id);
create policy "dono atualiza" on nutritrack for update using (auth.uid() = user_id);
=====================================================================
-->

<div id="auth">

      <li class="menu-item" data-k="bio" onclick="ir('bio')"><span>📊</span> Relatório Bioimpedância</li>
    </ul>

<script>
/* ===================== DADOS / CONTAS ===================== */
const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = CLOUD ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let user = null;
const novoEstado = () => ({
  metas: {prot: 120, carb: 130, veg: 3, agua: 3.0},
  refeicoes: [], dia: "", agua: 0, veg: 0,
  hist: {},   // { "2026-10-24": gramas de proteína }
  bio: []     // [{data, gordura, musculo}]
});
let state = novoEstado();

const hoje = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtData = d => d.split("-").reverse().join("/");
const sha = async t => {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("nutritrack::" + t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
};
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const lsSet = (k, v) => localStorage.setItem(k, JSON.stringify(v));

async function cadastrar(nome, email, senha) {
  if (CLOUD) {
    const {data, error} = await sb.auth.signUp({email, password: senha, options: {data: {nome}}});
    if (error) throw error;
    if (!data.session) throw new Error("Conta criada! Confirme o e-mail enviado e depois entre.");
    return {id: data.user.id, nome, email};
  }
  const users = lsGet("nt_users", {});
  if (users[email]) throw new Error("Este e-mail já tem conta.");
  users[email] = {id: "u_" + Date.now(), nome, email, hash: await sha(senha)};
  lsSet("nt_users", users);
  return {id: users[email].id, nome, email};
}
async function entrar(email, senha) {
  if (CLOUD) {
    const {data, error} = await sb.auth.signInWithPassword({email, password: senha});
    if (error) throw new Error("E-mail ou senha incorretos.");
    return {id: data.user.id, nome: data.user.user_metadata?.nome || email, email};
  }
  const u = lsGet("nt_users", {})[email];
  if (!u || u.hash !== await sha(senha)) throw new Error("E-mail ou senha incorretos.");
  return {id: u.id, nome: u.nome, email};
}
async function carregar() {
  let d;
  if (CLOUD) {
    const r = await sb.from("nutritrack").select("dados").eq("user_id", user.id).maybeSingle();
    d = r.data?.dados;
  } else d = lsGet("nt_dados_" + user.id, null);
  state = Object.assign(novoEstado(), d || {});
  // Conta nova (vazia): já entra com o plano alimentar e as medições iniciais
  if (!state.semeado && !state.refeicoes.length && !state.bio.length) {
    state.refeicoes = PLANO_INICIAL.map((r, i) => ({id: "p" + Date.now() + i, feito: false, ...r}));
    MEDICOES_INICIAIS.forEach((m, i) => state.bio.push({id: "seed" + i, ...m}));
  }
  state.semeado = true;
  virarODia();
}

let saveT;
function salvar() {
  clearTimeout(saveT);

    else lsSet("nt_dados_" + user.id, state);
  }, 300);
}
/* Quando muda o dia: guarda a proteína de ontem no histórico e zera o checklist */
function virarODia() {
  const h = hoje();
  if (state.dia && state.dia !== h) {
    state.hist[state.dia] = totais().prot;
    state.refeicoes.forEach(r => r.feito = false);
    state.agua = 0; state.veg = 0;
  }
  state.dia = h; salvar();
}
function totais() {
  const f = state.refeicoes.filter(r => r.feito);
  return {prot: f.reduce((a,r) => a + r.prot, 0), carb: f.reduce((a,r) => a + r.carb, 0)};
}

/* --- BIOIMPEDÂNCIA --- */
let bioSel = null;
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const FAIXA = [56.66, 76.26, 91.57];
const corStatus = s => ({"Excelente":"#2E9E4F","Saudável":"#2E9E4F","Alto":"#E0A100","Baixo":"#3A9BDC","Obeso":"#E5484D","Grave":"#C0152B","Suavemente":"#E8743B"}[s] || "#6C657B");
const statusPeso = p => p < FAIXA[0] ? "Baixo" : p < FAIXA[1] ? "Saudável" : p < FAIXA[2] ? "Alto" : "Obeso";
const f2 = n => Number(n).toFixed(2).replace(".", ",");
const f1 = n => Number(n).toFixed(1).replace(".", ",");
const mesAno = d => { const [a, m] = d.split("-"); return MESES[+m - 1] + " " + a; };
const altsDe = r => Array.isArray(r.trocas) ? r.trocas : (r.trocas ? [r.trocas] : []);
function posEscala(p) {
  const seg = p < FAIXA[0] ? p / FAIXA[0]
    : p < FAIXA[1] ? 1 + (p - FAIXA[0]) / (FAIXA[1] - FAIXA[0])
    : p < FAIXA[2] ? 2 + (p - FAIXA[1]) / (FAIXA[2] - FAIXA[1])
    : 3 + Math.min(1, (p - FAIXA[2]) / 25);
  return Math.max(2, Math.min(98, seg * 25));
}
function contar(el, alvo, dec) {
  const t0 = performance.now(), dur = 1200;
  const passo = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (alvo * e).toFixed(dec).replace(".", ",");
    if (k < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}
function abrirRel(id) { bioSel = id; ir("bio"); }
function fecharRel() { bioSel = null; ir("bio"); }

function telaBio() {
  const b = [...state.bio].sort((a, c) => a.data.localeCompare(c.data));
  if (bioSel && b.some(x => x.id === bioSel)) return telaRelatorio(b);

  const cp = b.filter(x => x.peso), f = cp[0], l = cp[cp.length - 1], temComp = cp.length >= 2;

  main.innerHTML = `
    <div class="header"><h2>Relatório de Bioimpedância</h2><p>Sua evolução e o relatório completo de cada medição</p></div>
    ${hero}
    ${temComp ? '<div class="card"><h3 class="card-title">Início x atual</h3><canvas id="chartComp" height="120"></canvas></div>' : ""}
    ${b.length ? '<div class="card"><h3 class="card-title">Evolução ao longo do tempo</h3><canvas id="chartBio" height="120"></canvas></div>' : '<div class="card"><p class="empty">Adicione sua primeira medição abaixo para ver os gráficos.</p></div>'}
    ${b.length ? `<div class="card"><h3 class="card-title">Relatórios por data</h3><p class="empty" style="margin:-10px 0 14px 4px">Toque em uma data para abrir o relatório completo.</p><div class="chips">${chips}</div></div>` : ""}
    <div class="card">
      <h3 class="card-title">Nova medição</h3>
      <div class="form">
        <div><label>Data</label><input id="bd" type="date" value="${hoje()}"></div>
        <div><label>Peso (kg)</label><input id="bp" type="number" step="0.01"></div>
        <div><label>Massa de gordura (kg)</label><input id="bg" type="number" step="0.1"></div>
        <div><label>Massa muscular esquelética (kg)</label><input id="bm" type="number" step="0.1"></div>
        <div><label>Gordura (%) — opcional</label><input id="bpc" type="number" step="0.1"></div>
        <div><label>Gordura visceral — opcional</label><input id="bv" type="number" step="1"></div>
        <button onclick="addBio()">Adicionar</button>
      </div>
    </div>`;
  if (temComp) {
    contar(nIni, f.peso, 2); contar(nFim, l.peso, 2);
    charts.push(new Chart(chartComp, {
      type: "bar",

        {label: "Início", data: [f.peso, f.gordura, f.musculo], backgroundColor: "#D9B8F7", borderRadius: 14, borderSkipped: false},
        {label: "Atual", data: [l.peso, l.gordura, l.musculo], backgroundColor: "#7B2CBF", borderRadius: 14, borderSkipped: false}
      ]},
      options: {responsive: true, animation: {duration: 1400, easing: "easeOutQuart"}, plugins: {legend: {position: "bottom", labels: {usePointStyle: true, boxWidth: 8}}},
        scales: {x: {grid: {display: false}}, y: {beginAtZero: true, grid: {color: "#F0E8FA"}}}}
    }));
  }
  if (b.length) {
    const ds = (label, key, cor, rgb) => ({label, data: b.map(x => x[key] ?? null), borderColor: cor, backgroundColor: `rgba(${rgb},.12)`, fill: true, spanGaps: true, tension: .4, borderWidth: 4, pointRadius: 7, pointHoverRadius: 9, pointBackgroundColor: "#fff", pointBorderColor: cor, pointBorderWidth: 4});
    charts.push(new Chart(chartBio, {
      type: "line",
      data: {labels: b.map(x => fmtData(x.data).slice(0, 5)), datasets: [ds("Peso (kg)", "peso", "#3A86EF", "58,134,239"), ds("Massa de gordura (kg)", "gordura", "#7B2CBF", "123,44,191"), ds("Massa muscular (kg)", "musculo", "#2EC4B6", "46,196,182")]},
      options: {responsive: true, animation: {duration: 1600, easing: "easeOutQuart"}, interaction: {mode: "index", intersect: false},
        plugins: {legend: {position: "bottom", labels: {usePointStyle: true, boxWidth: 8}}},
        scales: {x: {grid: {display: false}}, y: {grid: {color: "#F0E8FA"}}}}
    }));
  }
}

/* Relatório completo de uma data (igual ao app da balança) */
function telaRelatorio(b) {
  const i = b.findIndex(x => x.id === bioSel), x = b[i], prev = b[i - 1];
  const st = x.peso ? statusPeso(x.peso) : "";
  const comp = x.comp || (prev && prev.peso && x.peso ? {data: fmtData(prev.data), delta: +(x.peso - prev.peso).toFixed(2)} : null);
  const linhas = x.det && x.det.length ? x.det : [
    ["Peso (kg)", x.peso != null ? Number(x.peso).toFixed(2) : "", st],
    ["Gordura (%)", x.pct ?? "", ""],
    ["Peso da gordura (kg)", x.gordura ?? "", ""],
    ["Peso da massa muscular esquelética (kg)", x.musculo ?? "", ""],
    ["Gordura visceral", x.visc ?? "", ""]
  ].filter(r => r[1] !== "");
  const abas = b.map(y => `<div class="chip mini ${y.id === x.id ? "on" : ""}" onclick="abrirRel('${y.id}')"><b>${fmtData(y.data).slice(0, 5)}</b><small>${mesAno(y.data).split(" ")[0]}</small></div>`).join("");
  const escala = x.peso ? `
      <div class="ticks"><span style="left:25%">${FAIXA[0]}</span><span style="left:50%">${FAIXA[1]}</span><span style="left:75%">${FAIXA[2]}</span></div>
      <div class="escala"><div class="seg" style="background:#7FD1F5"></div><div class="seg" style="background:#6CCB7B"></div><div class="seg" style="background:#F5C842"></div><div class="seg" style="background:#EF5B6E"></div>
        <div class="mark" style="left:${posEscala(x.peso)}%;border-color:${corStatus(st)}"></div></div>
      <div class="esc-lab"><span>Baixo</span><span>Saudável</span><span>Alto</span><span>Obeso</span></div>` : "";
  main.innerHTML = `
    <div class="header"><button onclick="fecharRel()" style="margin-bottom:16px">← Voltar</button><h2>Relatório · ${mesAno(x.data)}</h2><p>Toque em outra data para comparar os relatórios</p></div>
    <div class="chips-h">${abas}</div>
    <div class="card rel-top">
      ${x.peso ? `<span class="st" style="background:${corStatus(st)}">${st}</span><div class="big"><span id="nRel">0</span><small> kg</small></div>` : ""}
      <p class="empty">${fmtData(x.data)}${x.hora ? " " + x.hora : ""}</p>
      ${escala}
      ${comp ? `<div class="comp"><span>Comparado com a última vez (${comp.data})</span><b style="color:${comp.delta <= 0 ? "#0F8F82" : "#B26A00"}">${comp.delta > 0 ? "+" : ""}${f2(comp.delta)}</b></div>` : ""}
    </div>
    <div class="card"><h3 class="card-title">Métricas corporais</h3>
      <div class="metricas">${linhas.map(r => `<div class="mrow"><span>${esc(r[0])}</span><div><b>${esc(r[1])}</b>${r[2] ? `<small style="color:${corStatus(r[2])}">${esc(r[2])} <i style="background:${corStatus(r[2])}"></i></small>` : ""}</div></div>`).join("")}</div>
    </div>
    <div style="text-align:center"><button class="del" onclick="apagarBio('${x.id}')">Remover este relatório</button></div>`;
  if (x.peso) contar(nRel, x.peso, 2);
}
function addBio() {
  if (!bd.value || !bp.value || !bg.value || !bm.value) return alert("Preencha data, peso, gordura e músculo.");
  state.bio.push({id: "b" + Date.now(), data: bd.value, peso: +bp.value, gordura: +bg.value, musculo: +bm.value,
    pct: bpc.value ? +bpc.value : undefined, visc: bv.value ? +bv.value : undefined});
  salvar(); ir("bio");
}
function carregarPlano() {
  if (state.refeicoes.length && !confirm("Isso substitui as refeições atuais pelo plano inicial. Continuar?")) return;
  state.refeicoes = PLANO_INICIAL.map((r, i) => ({id: "p" + Date.now() + i, feito: false, ...r}));
  salvar(); ir("plan");
}
function carregarTudo() {
  state.refeicoes = PLANO_INICIAL.map((r, i) => ({id: "p" + Date.now() + i, feito: false, ...r}));
  MEDICOES_INICIAIS.forEach((m, i) => { if (!state.bio.some(x => x.data === m.data)) state.bio.push({id: "seed" + i, ...m}); });
  salvar(); ir("home");
}
function apagarBio(id) {
  if (!confirm("Remover esta medição?")) return;
  state.bio = state.bio.filter(x => x.id !== id); bioSel = null; salvar(); ir("bio");
}
</script>
